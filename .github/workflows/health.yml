# Recurring aggregator smoke test (ROADMAP.md item 8.6) — a non-matchday safety
# net for the scraper. The real scrape workflow (scrape.yml) only exercises the
# aggregator sites while a Derby match is actually live-adjacent; this one hits
# every SITES URL on a schedule and asserts the homepage is still fetchable +
# parseable with a nav pattern. It is deliberately ISOLATED from the real
# scraper:
#   - runs only `start health` (never `next` / collectStreams / fixtures)
#   - needs no FOOTBALL_DATA_KEY and expects no .env secrets
#   - commits nothing, writes no data/
# The CLI pings Slack on failure itself via the SLACK_WEBHOOK_URL no-op pattern
# (see notify.ts / health.ts) — unset webhook = log and skip, exit code unmuted.
name: health

on:
  schedule:
    # Weekly, Monday 06:00 UTC — matchday-agnostic, so any day works; weekly
    # keeps the free-tier burn from the 15-min scrape cron modest.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional: Slack ping happens inside the CLI, no-op when unset.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Smoke-test the four aggregator sites
        run: bun run --filter '@derby-streams/scraper' start health