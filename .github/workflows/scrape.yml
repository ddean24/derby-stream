# Scheduled scraper — pre-warms fixtures ~1h before kickoff, refreshes streams
# every 15 min while a match is live, and commits the results to data/.
#
# Scheduling design:
#   A fixed cron (`*/15 * * * *`) still fires every 15 min, but the heavy scrape
#   no longer runs all day. A cheap `gate` job (no Bun install, no dep checkout)
#   asks football-data for Derby's upcoming/live fixtures and only lets the
#   `scrape` job run when a match is within the look-ahead window (default 4h) or
#   already live. Idle polls cost seconds instead of a full Bun + typecheck run,
#   so the 15-min cadence stays responsive (catches kickoff, refreshes during the
#   match) while burning almost no Actions minutes when nothing is scheduled.
#   Manual `workflow_dispatch` (with or without a fixture id) always runs. The
#   look-ahead is tunable via the gate's LOOKAHEAD_MIN env (minutes).
#
# workflow_dispatch is a free manual trigger for ad-hoc runs. Item 4.3 owns the
# manual-trigger UX; the optional fixture_id input below is how a human forces a
# scrape outside the cron (e.g. right before kickoff, or for a specific cup tie).
#
# [skip ci] convention: the pushed commit touches only data/. The trailing
# [skip ci] in the message prevents any push-triggered workflow from building
# against it (harmless if none exist; conventional to include).
name: scrape

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      # Empty -> the CLI runs `next` (next upcoming/live fixture); a filled-in
      # id -> the CLI scrapes that specific fixture (incl. finished ones).
      fixture_id:
        description: "football-data.org fixture id to scrape (optional; defaults to the next upcoming/live fixture)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Decide whether a scrape is due
        id: decide
        env:
          LOOKAHEAD_MIN: "240"
          TEAM_ID: "342"
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          set -uo pipefail
          # Manual dispatch (incl. a forced fixture id) always runs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch -> run"
            exit 0
          fi
          KEY="$FOOTBALL_DATA_KEY"
          if [ -z "$KEY" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "FOOTBALL_DATA_KEY unset -> run to surface error"
            exit 0
          fi
          # Ask football-data for Derby's SCHEDULED/TIMED/IN_PLAY matches; run
          # when a match is live or within LOOKAHEAD_MIN of kickoff. On any
          # failure we run anyway, so a transient API error can never hide a
          # match's streams.
          curl -s -H "X-Auth-Token: $KEY" \
            "https://api.football-data.org/v4/teams/${TEAM_ID}/matches?status=SCHEDULED,TIMED,IN_PLAY" \
          | node -e '
            const fs = require("fs");
            let body = "";
            try { body = fs.readFileSync(0, "utf8"); } catch { body = "{}"; }
            let shouldRun = true;
            try {
              const data = JSON.parse(body);
              const matches = data.matches || [];
              if (matches.length === 0) {
                console.log("no upcoming/live matches -> skip");
                shouldRun = false;
              } else {
                const now = Date.now();
                const lookahead = parseInt(process.env.LOOKAHEAD_MIN, 10) * 60 * 1000;
                let live = false, earliest = Infinity;
                for (const m of matches) {
                  const s = (m.status || "").toUpperCase();
                  if (s === "TIMED" || s === "IN_PLAY" || s === "PAUSED") live = true;
                  const t = Date.parse(m.utcDate);
                  if (!isNaN(t) && t < earliest) earliest = t;
                }
                if (live) {
                  console.log("live/in-play match -> run");
                } else if (earliest - now <= lookahead) {
                  console.log("kickoff within window (" + Math.round((earliest - now) / 60000) + " min) -> run");
                } else {
                  console.log("next kickoff " + Math.round((earliest - now) / 60000) + " min away -> skip");
                  shouldRun = false;
                }
              }
            } catch (e) {
              console.log("gate parse error -> run to avoid missing match: " + e.message);
              shouldRun = true;
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "should_run=" + shouldRun + "\n");
          '

  scrape:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Real secret wiring: the repo secrets are surfaced here as job env vars.
      # We do NOT `source .env.github` in the shell — GitHub only expands ${{ }}
      # at the YAML layer, not inside shell files. .env.github documents this
      # exact mapping for local runs. SLACK_WEBHOOK_URL is optional: the notify
      # step is a safe no-op when it is unset.
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check FOOTBALL_DATA_KEY is set
        # Fail fast with an actionable message before the scraper 401s. The
        # explicit step env keeps this guard working even if the job-level env
        # above were ever removed.
        run: |
          if [ -z "$FOOTBALL_DATA_KEY" ]; then
            echo "::error::FOOTBALL_DATA_KEY secret is not configured. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Typecheck scraper
        run: bunx --bun tsc --noEmit -p apps/scraper/tsconfig.json

      - name: Run scraper
        # Empty input expands to a falsy '' -> `|| 'next'` picks `next`; a
        # filled-in fixture id is passed straight through to the CLI.
        run: bun run --filter '@derby-streams/scraper' start ${{ github.event.inputs.fixture_id || 'next' }}

      - name: Alert when streams go live
        # One-shot Slack alert per fixture (PLAN.md item 7.2). Safe no-op when
        # streams.json is absent or SLACK_WEBHOOK_URL is unset; persists
        # alerted fixture ids to data/alerts.json so re-runs stay silent.
        run: bun run --filter '@derby-streams/scraper' notify

      - name: Commit and push data changes
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git -c user.name="derby-streams-bot" \
                -c user.email="actions@users.noreply.github.com" \
                commit -m "chore(data): update fixtures and streams [skip ci]"
            git push origin HEAD
          fi
