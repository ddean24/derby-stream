# Builds apps/web (React + Vite + Tailwind, fully static) and deploys the
# output to GitHub Pages using the official Pages deployment stack:
#   - actions/configure-pages@v5   configures the Pages backend for this repo
#   - actions/upload-pages-artifact@v3  uploads the static output as an artifact
#   - actions/deploy-pages@v4      publishes the artifact to Pages
# This replaces the legacy peaceiris/actions-gh-pages / ghp-import flows and is
# the current recommended GitHub Actions pattern for Pages.
#
# The site is fully static: it reads committed data/*.json (produced by the
# scrape.yml workflow) at build/browse time — no server, no database. The web
# build MUST bundle against that committed data/, which is why we build with
# `bun run --filter '@derby-streams/web' build` (real `vite build` once item 5.1
# scaffolds the app) rather than fetching data at runtime. Since the site is
# served as plain static files, a single build artifact is enough — no deploy
# token per-branch, no secrets required.
#
# trigger: push to main (default branch) and a free manual trigger. Item 4.3
# coordinates manual triggers across workflows; having workflow_dispatch here
# is expected.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install

      - name: Typecheck web
        # Explicit -p so the web tsconfig is picked up (matches scrape.yml's
        # pattern of passing the per-app tsconfig explicitly).
        run: bunx --bun tsc --noEmit -p apps/web/tsconfig.json

      - name: Build web
        # `bun run --filter '@derby-streams/web' build` runs apps/web's build
        # script. Today that script is a placeholder (`exit 0`); item 5.1
        # replaces it with the real `vite build`.
        run: bun run --filter '@derby-streams/web' build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Coupling note for item 5.1: this path MUST match what the Vite app
          # sets as its build outDir. Vite's default outDir is `dist` relative
          # to the app root (apps/web), so the artifact path is apps/web/dist.
          # If 5.1 configures a custom outDir, update this path to match.
          path: apps/web/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
